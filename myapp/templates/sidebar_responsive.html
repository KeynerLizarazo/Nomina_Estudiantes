<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página Inicial</title>
  <!-- Bootstrap CSS -->
  <link href="../../scss/custom.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <!-- Font Awesome para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
 
</head>

<body class="m-0 p-0">
  <div class="bg-my-background-color d-flex text-white ">
    <!-- Barra lateral izquierda -->
    <div class="sidebar degradado-sidebar d-flex flex-column text-white 100vh overflow-hidden">
      <!-- Sidebar -->
      <a class="mt-3 nav-link" href="#">
        <img src="../../static/assets/images/main.png"  height="26" width="30">
        <span class="nav-text">Inicio</span>
      </a>
      <hr class="">
      <a class="mt-2 nav-link" href="#">
        <!-- ultimo icono (estudiantes) -->
        <img src="../../static/assets/images/estudiantes.png" width="28" height="28">
        <span class="nav-text">Estudiantes</span>
      </a>
      <a class="nav-link" href="#">
        <img src="../../static/assets/images/usuarios.png" width="28" height="28">
        <span class="nav-text">Usuarios</span>
      </a>
      <a class="nav-link" href="#">
        <img src="../../static/assets/images/cursos.png" width="28" height="28">
        <span class="nav-text">Cursos</span>
      </a>
      <a class="nav-link" href="#">
        <img src="../../static/assets/images/mipefil.png" width="28" height="28">
        <span class="nav-text">Mi Perfil</span>
      </a>
      <a class="nav-link mt-auto" href="#">
        <img src="../../static/assets/images/logout1.png" width="28" height="28">
        <span class="nav-text">Cerrar Sesión</span>
      </a>

      
    </div>

    <!-- Contenido principal -->
    <main class="main-content vh-100 d-flex flex-grow-1 p-3 align-items-center justify-content-center">
      <div class="container-fluid">
        <div class="row justify-content-center align-items-center ">
          <img src="../../static/assets/images/aguila.png" alt="Imagen transparente"
            class="aguila-trans img-fluid mx-auto z-0 position-absolute pe-none">
          <!-- Columna izquierda - Logo y texto -->
          <div class="col-md-6 text-center z-1">
            <img src="../../static/assets/images/minilogowhite.png" alt="Logo" class="img-fluid pe-none"
              style="max-height: 100px;">
            <h1 class="display-5 fw-bold"><b>Bienvenid@</b></h1>
            <p class="fs-2">Aprende con nosotros</p>

          </div>
        </div>
      </div>
    </main>
  </div>
  <!-- Bootstrap JS Bundle -->
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
