{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

      <a class="mt-2 nav-link" href="{% url 'cedulas' %}" id="control-nomina-btn">

      </a>

        aria-expanded="false"
        aria-label="Más opciones"
      >
        ⋮
      </button>

      <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
        <li><a class="dropdown-item" href="#editar">Editar</a></li>

      </ul>
