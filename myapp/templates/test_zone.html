{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Nómina - The Professor</title>
  <!-- Bootstrap CSS -->
  <link href="{% static 'assets/styles/custom.css' %}" rel="stylesheet" />
  <link href="{% static 'assets/styles/main-style.css' %}" rel="stylesheet" />

  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.2/dist/sweetalert2.min.css" rel="stylesheet">
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">

  <style>
    .doble-borde {
      width: 200px;
      height: 200px;
      background-color: #f0f0f0;
      /* Color de fondo del elemento */
      box-shadow:
        0 0 0 5px white,
        /* Borde blanco */
        0 0 0 10px red;
      /* Borde rojo */
    }
  </style>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>

<body class="m-0 p-0">
  <div class="bg-my-background-color d-flex text-white ">
    <!-- Barra lateral izquierda -->
    <div class="sidebar degradado-sidebar d-flex flex-column text-white min-vh-100 overflow-hidden">
      <!-- Sidebar -->
      <a class="mt-3 nav-link " href="{% url 'welcome' %}" id="welcome-btn">
        <img src="../../static/assets/images/main.png" height="26" width="30">
        <span class="nav-text">Inicio</span>
      </a>
      <hr class="">
      <a class="mt-2 nav-link" href="{% url 'cedulas' %}" id="control-nomina-btn">
        <img src="../../static/assets/images/estudiantes.png" width="28" height="28">
        <span class="nav-text">Estudiantes</span>
      </a>
      <a class="nav-link" href="#">
        <img src="../../static/assets/images/usuarios.png" width="28" height="28">
        <span class="nav-text">Usuarios</span>
      </a>
      <a class="nav-link" href="{% url 'cursos' %}" id="cursos-btn">
        <img src="../../static/assets/images/cursos.png" width="28" height="28">
        <span class="nav-text">Cursos</span>
      </a>
      <a class="nav-link" href="#">
        <img src="../../static/assets/images/mipefil.png" width="28" height="28">
        <span class="nav-text">Mi Perfil</span>
      </a>
      <a class="nav-link" href="{% url 'test_zone' %}" id="test_zone-btn">
        <span class="nav-text">test_zone</span>
      </a>
      <a class="nav-link mt-auto" href="{% url 'logout' %}">
        <img src="../../static/assets/images/logout1.png" width="28" height="28">
        <span class="nav-text">Cerrar Sesión</span>
      </a>


    </div>



    <!-- Contenido principal -->


    <div class="list-group d-flex flex-column gap-3 w-100 mx-5 position-relative">
      <!-- Elemento que se expande -->
      <div class="doble-borde"></div>
    </div>

      </button>
    
    -->



    <!-- no borrar a partir de aquí -->
  </div>

  <!-- Importar Bootstrap Icons -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>

  <!-- Importar Bootstrap JS (opcional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Bootstrap JS Bundle -->
  <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
