{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Evaluaciones - The Professor</title>

  <!-- Bootstrap CSS -->
  <link href="{% static 'assets/styles/custom.css' %}" rel="stylesheet" />
  <link href="{% static 'assets/styles/main-style.css' %}" rel="stylesheet" />

  <!-- SweetAlert2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.2/dist/sweetalert2.min.css" rel="stylesheet">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body class="m-0 p-0">
<div class="bg-my-background-color d-flex text-white">
  <!-- SIDEBAR -->
  {% include 'partials/sidebar.html' %}

  <!-- Contenido principal -->
  <main class="main-content vh-100 p-3 mx-3 flex-grow-1 overflow-auto pt-4">
    <div class="card shadow">
      <div class="card-header">Gestión de Evaluaciones</div>
      <div class="card-body">
        <div class="mb-3">
          <!-- Formulario de Búsqueda -->
          <form class="d-flex" method="get" action="{% url 'evaluaciones' %}">
            <div class="input-group me-2">
              <input type="text" name="q" class="form-control" placeholder="Buscar grupo..." value="{{ query|default_if_none:'' }}">
            </div>
            <select name="campo" class="form-select w-25 me-2">
              <option value="todos" {% if campo == "todos" %}selected{% endif %}>Todos los campos</option>
              <option value="name_group_levels" {% if campo == "name_group_levels" %}selected{% endif %}>Nombre del Grupo</option>
            </select>
            <button class="btn btn-secondary" type="submit">Buscar</button>
            <a href="{% url 'evaluaciones' %}" class="btn btn-secondary ms-2 me-2">Refrescar</a>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
              Añadir
            </button>
          </form>
        </div>

        <!-- Tabla de Resultados -->
        <div class="table-responsive">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Acciones</th>
                <th>Tipo</th>
                <th>Unidad</th>
              </tr>
            </thead>
            <tbody id="tabla-resultados">
              
                <tr>
                  <td class="text-center">
                    <button type="button" class="btn btn-warning btn-sm mb-1" data-bs-toggle="modal"
                      data-bs-target="#controlNominaModal" data-grupo-id="{{ grupo.id }}">Editar</button>
                    <form action="" method="post" >
                      {% csrf_token %}
                      <button type="submit" class="btn btn-danger btn-sm mb-1">Eliminar</button>
                    </form>

                    <a href="{% url 'notas' %}" class="btn btn-primary btn-sm">Notas</a>
                  </td>
                  <td>{{ grupo.name_group_levels }}</td>
                </tr>
                
                <tr>
                  <td colspan="2" class="text-center text-muted">No se encontraron grupos.</td>
                </tr>
              
            </tbody>
          </table>
        </div>

        <!-- Paginación -->
        <div class="pagination-container d-flex justify-content-center align-items-center my-4">
          <button 
            id="prev-page" 
            class="btn pagination-btn" 
            {% if not grupos.has_previous %}disabled{% endif %}
          >
            <img src="{% static 'assets/images/flecha_izq.png' %}" alt="Anterior" width="40" height="30">
          </button>
          <span id="page-info" class="page-info text-white mx-3">
            {{ grupos.number }} / {{ grupos.paginator.num_pages }}
          </span>
          <button 
            id="next-page" 
            class="btn pagination-btn" 
            {% if not grupos.has_next %}disabled{% endif %}
          >
            <img src="{% static 'assets/images/flecha_der.png' %}" alt="Siguiente" width="40" height="30">
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.2/dist/sweetalert2.all.min.js"></script>

<script>
  // Paginación con flechas personalizadas
  document.addEventListener('DOMContentLoaded', function () {
    const prevButton = document.getElementById('prev-page');
    const nextButton = document.getElementById('next-page');
    const currentPage = {{ grupos.number }};
    const totalPages = {{ grupos.paginator.num_pages }};
    const query = "{{ query|default:'' }}";
    const campo = "{{ campo|default:'' }}";

    function buildURL(page) {
      const url = new URL(window.location.href.split('?')[0], window.location.origin);
      if (page > 1) url.searchParams.append('page', page);
      if (query) url.searchParams.append('q', query);
      if (campo && campo !== 'todos') url.searchParams.append('campo', campo);
      return url.toString();
    }

    if (prevButton && !prevButton.disabled) {
      prevButton.addEventListener('click', () => window.location.href = buildURL(currentPage - 1));
    }
    if (nextButton && !nextButton.disabled) {
      nextButton.addEventListener('click', () => window.location.href = buildURL(currentPage + 1));
    }
  });
</script>

<script>
  // Mostrar mensajes con SweetAlert
  $(document).ready(function () {
    {% if messages %}
      {% for message in messages %}
        Swal.fire({
          icon: '{{ message.tags }}',
          title: '{% if message.tags == "success" %}¡Éxito!{% elif message.tags == "error" %}Error{% else %}Notificación{% endif %}',
          text: '{{ message }}',
          confirmButtonText: 'Aceptar'
        });
      {% endfor %}
    {% endif %}
  });
</script>

<script>
  // Protección contra navegación del historial sin autenticación
  const isAuthenticated = "{{ request.user.is_authenticated|yesno:'true,false' }}";
  window.onpageshow = function (event) {
    if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
      if (isAuthenticated === 'false') {
        window.location.href = "{% url 'login' %}";
      }
    }
  };
</script>
</body>
</html>
