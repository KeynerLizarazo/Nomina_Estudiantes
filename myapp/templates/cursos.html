  <script>
    document.querySelectorAll('.more-options-btn').forEach(button => {
      button.addEventListener('click', function (event) {
        event.stopPropagation(); // Evita que el clic afecte al padre
      });
    });

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script> -->


  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // Cerrar otros dropdowns al abrir uno nuevo
    document.querySelectorAll('.dropdown').forEach(dropdown => {
      dropdown.addEventListener('show.bs.dropdown', function (event) {
        const current = event.currentTarget;

        document.querySelectorAll('.dropdown.show').forEach(other => {
          if (other !== current) {
            const instance = bootstrap.Dropdown.getInstance(other);
            if (instance) instance.hide();
          }
        });
      });
    });

    // Opcional: Cerrar dropdown al hacer clic fuera
    document.addEventListener('click', function (event) {
      document.querySelectorAll('.dropdown.show').forEach(dropdown => {
        const toggle = dropdown.querySelector('[data-bs-toggle="dropdown"]');
        if (!dropdown.contains(event.target) && !event.target.closest('.dropdown')) {
          const instance = bootstrap.Dropdown.getInstance(dropdown);
          if (instance) instance.hide();
        }
      });
    });
  });
</script>
